name: GHCR LTX 2.5 image

# Builds Dockerfile.ltx25 and pushes it to GHCR. RunPod's GitHub-build registry
# (registry.runpod.net) stopped granting pull auth to new hosts, so endpoints
# pull this image from ghcr.io instead.

on:
  push:
    branches: [feat/ltx25-comfy-038]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build"
        required: true
        default: "feat/ltx25-comfy-038"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          df -h /

      - name: Resolve tag
        run: echo "SHA9=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ltx25
          push: true
          build-args: |
            SENAI_IMAGE_REF=ghcr.io/${{ github.repository_owner }}/worker-comfyui-ltx25:${{ env.SHA9 }}
          tags: ghcr.io/${{ github.repository_owner }}/worker-comfyui-ltx25:${{ env.SHA9 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
