name: Tests

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest jsonschema
      - name: Worker contracts and lifecycle
        run: python -m pytest tests -q
      - name: Startup syntax
        run: bash -n src/start.sh
