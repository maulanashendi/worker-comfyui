# LTX 2.5 motion transfer ("Match & Move"): driving video -> DWPose pose frames ->
# IC-LoRA Union Control guide, start image = target person as the first frame. int8 only.
# Graph derived from Lightricks/ComfyUI-LTXVideo@5722b53 example_workflows/2.5/
# LTX-2.5_ICLoRA_Union_Control_Distilled.json (pose branch), with our int8 transformer
# and int8 Gemma 12B in place of the bf16 files, no API text encoder, no prompt enhancer
# and no upscale stage. Never swap in the bf16 transformer here.
version: 2
set: senfers1-motion
requires_comfyui: '>=0.38.0'
custom_nodes:
- name: ComfyUI-LTXVideo
  repo: https://github.com/Lightricks/ComfyUI-LTXVideo.git
  revision: 5722b53a08daec57f5442347b235cb84df0afbe7
# HEAD of master on 2026-10-01 (2026-09-28). Has DWPreprocessor with the torchscript
# bbox/pose path and the 2026-08-27 RGB->BGR DWPose detection fix (8ed6e34).
# `pip` replaces the pack's requirements.txt (onnxruntime-gpu, mediapipe,
# opencv-contrib-python, trimesh, ...): only what the DWPose torchscript path imports.
- name: comfyui_controlnet_aux
  repo: https://github.com/Fannovel16/comfyui_controlnet_aux.git
  revision: 0cd290477128d42cdc3e76a826a402d866e8c684
  pip:
  - opencv-python-headless>=4.7.0.72,<5
  - matplotlib
  - scikit-image
workflows:
- senfers1-motion-v1.json
allowed_class_types_extra: []
limits:
  no_progress_sec: 120
  no_progress_load_sec: 600
  execution_ceiling_sec: 1800
warmup_graph: null
models:
- path: diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors
